version: '3.8'

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: venus_test_postgres
    environment:
      POSTGRES_DB: venus_test_db
      POSTGRES_USER: venus_test
      POSTGRES_PASSWORD: venus_test_pwd
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venus_test -d venus_test_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  test-runner:
    image: golang:1.23-alpine
    container_name: venus_test_runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CI: "true"
      REQUIRE_PG: "1"
      CGO_ENABLED: "1"
      TEST_DATABASE_URL: "postgres://venus_test:venus_test_pwd@postgres:5432/venus_test_db?sslmode=disable"
      VAULT_HMAC_SECRET: "VENUS_VAULT_HMAC_SECRET_2026_PRODUCTION"
      VAULT_ENCRYPTION_KEY: "VENUS_VAULT_AES256_ROOT_KEY_2026_PRODUCTION"
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "apk add --no-cache gcc musl-dev &&
             go test -race -count=1 -v ./internal/handlers ./internal/hierarchy ./internal/middleware ./internal/scheduler ./internal/vault ./internal/reconcile"
